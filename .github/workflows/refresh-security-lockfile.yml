name: Refresh security dependency lockfile
on:
  push:
    branches:
      - production-readiness/stage-a-followup
    paths:
      - package.json
      - .github/workflows/refresh-security-lockfile.yml
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/refresh-security-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Domain tests
        run: npm run test:domains
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh security dependency lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/domain-reselling-platform
      - feature/unified-billing-platform
  pull_request:
    branches:
      - main
      - develop
      - feature/domain-reselling-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Domain provider response tests
        run: npm run test:domains

  database-schema:
    name: Domain schema integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hembox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hembox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: hembox_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap Supabase-compatible auth roles for isolated schema tests
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create schema storage;
          create table storage.buckets (
            id text primary key,
            name text not null,
            public boolean not null default false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          create table auth.users (
            id uuid primary key default gen_random_uuid(),
            email text
          );
          create table public.profiles (
            id uuid primary key references auth.users(id) on delete cascade,
            role text not null default 'user'
          );
          create function auth.uid() returns uuid
          language sql stable
          as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          SQL

      - name: Apply domain migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016093000_domain_reselling_foundation.sql

      - name: Apply provider-independent pricing policy migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018090000_domain_pricing_policy.sql

      - name: Apply durable domain enquiry migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018100000_domain_enquiry_link.sql

      - name: Apply domain order transition guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019193000_domain_order_transition_guards.sql

      - name: Apply payment attempt lifecycle guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019203000_domain_payment_transition_guards.sql

      - name: Apply payment confirmation evidence guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019230000_domain_payment_confirmation_evidence.sql

      - name: Apply payment webhook event ledger
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019210000_domain_payment_webhook_ledger.sql

      - name: Apply payment webhook processing guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019220000_domain_payment_webhook_processing_guards.sql

      - name: Apply atomic domain quote creation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023100000_domain_quote_creation.sql

      - name: Apply manual payment claim workflow migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023110000_domain_manual_payment_claims.sql

      - name: Apply manual registration fulfillment migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023120000_domain_manual_registration.sql

      - name: Apply unified billing foundation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023130000_unified_billing_foundation.sql

      - name: Apply messaging foundation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023135000_messaging_foundation.sql

      - name: Apply billing arrangement workflow migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023140000_billing_arrangement_workflow.sql

      - name: Apply private receipt storage migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023150000_billing_receipt_storage.sql

      - name: Apply domain billing bridge migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023160000_domain_billing_bridge.sql

      - name: Assert domain schema constraints and security policies
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_reselling_foundation.test.sql

      - name: Assert pricing policy schema and access controls
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_pricing_policy.test.sql

      - name: Assert durable domain enquiry and audit behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_enquiry_link.test.sql

      - name: Assert domain order transition guards and audit behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_order_transition_guards.test.sql

      - name: Assert payment attempt lifecycle guards and audit behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_payment_transition_guards.test.sql

      - name: Assert payment webhook idempotency ledger
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_payment_webhook_ledger.test.sql

      - name: Assert atomic domain quote creation and idempotency
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_quote_creation.test.sql

      - name: Assert manual payment claim verification and authorization
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_manual_payment_claims.test.sql

      - name: Assert guarded manual registration fulfillment
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/domain_manual_registration.test.sql

      - name: Assert unified billing ledger invariants
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/unified_billing_foundation.test.sql

      - name: Assert billing arrangements and domain billing bridge
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/unified_billing_workflows.test.sql

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, database-schema]

    env:
      # Build-time placeholders only. Real production secrets stay in GitHub/Vercel secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder-cloud
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ci-placeholder-preset
      CLOUDINARY_CLOUD_NAME: ci-placeholder-cloud
      CLOUDINARY_API_KEY: ci-placeholder-api-key
      CLOUDINARY_API_SECRET: ci-placeholder-api-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
